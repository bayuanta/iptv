name: Soccer IPTV Scraper (UV Powered)

on:
  schedule:
    # Berjalan otomatis setiap 2 jam sekali agar aman dan hemat kuota
    - cron: "0 */2 * * *"
  workflow_dispatch: # Mengizinkan tombol manual "Run workflow" kapan saja

jobs:
  soccer-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Virtual Environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install UV Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python System
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright Browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
          restore-keys: |
            ${{ runner.os }}-playwright

      - name: Install Playwright Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: |
          uv run playwright install chromium
          uv run playwright install-deps

      - name: Execute Main Soccer Scraper
        run: |
          # Mengeksekusi pusat kendali fetch.py sepakbola kita
          uv run fetch.py

      - name: Commit and Push Changes to Github
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⚽ Automated Update Football Playlist"
          file_pattern: "TV.m3u8 events.m3u8"
          commit_author: "GitHub Actions Bot <actions@github.com>"
