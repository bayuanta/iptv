name: Soccer IPTV Scraper (UV Powered)

on:
  schedule:
    # Berjalan setiap 1 jam sekali untuk memeriksa pertandingan bola kaki
    - cron: "0 * * * *"
  workflow_dispatch: # Mengizinkan kamu klik tombol manual "Run workflow" kapan saja

jobs:
  soccer-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check Live Match Time (WIB Gate)
        id: check_time
        run: |
          # Mengunci jam aktif berdasarkan Zona Waktu Jakarta/WIB (+7)
          # Laga bola biasanya ramai dari jam 3 sore (15) hingga jam 5 subuh (05) besoknya
          hour=$(TZ=Asia/Jakarta date +%-H)
          if (( hour >= 15 || hour <= 5 )); then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.check_time.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Virtual Environment
        if: steps.check_time.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install UV Package Manager
        if: steps.check_time.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python System
        if: steps.check_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright Browsers
        id: cache-pw
        if: steps.check_time.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
          restore-keys: |
            ${{ runner.os }}-playwright

      - name: Install Playwright Chromium (Bypass Cache if needed)
        if: steps.check_time.outputs.run == 'true' && steps.cache-pw.outputs.cache-hit != 'true'
        run: |
          uv run playwright install chromium
          uv run playwright install-deps

      - name: Execute Main Soccer Scraper
        if: steps.check_time.outputs.run == 'true'
        run: |
          # Menyalakan otak utama fetch.py sepakbola kaki kita
          uv run fetch.py

      - name: Commit and Push Changes to Github
        if: steps.check_time.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⚽ Automated Update Football Playlist"
          # Kita pastikan mencatat file keluaran hasil editan fetch.py bola kita
          file_pattern: "TV.m3u8 events.m3u8"
          commit_author: "GitHub Actions Bot <actions@github.com>"
